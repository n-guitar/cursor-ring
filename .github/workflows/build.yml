name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CursorRing.xcodeproj \
            -target CursorRing \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Release/CursorRing.app CursorRing.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorRing-app
          path: CursorRing.zip
          if-no-files-found: error
